name: Build Tutorial

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  YARN_NPM_REGISTRY_SERVER: https://registry.npmmirror.com
  API: https://gitea.idealjs.com/api/v1/repos/idealjs/stack

jobs:
  build:
    name: Build @stack/tutorial (kaniko)
    runs-on: ci
    steps:
      - name: 拉源码（actions/checkout）
        uses: actions/checkout@v4

      - name: 写私有仓认证
        env:
          ALIYUN_DOCKER_USERNAME: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          ALIYUN_DOCKER_PASSWORD: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}
        run: |
          mkdir -p /kaniko/.docker
          printf '{"auths":{"registry.cn-hangzhou.aliyuncs.com":{"auth":"%s"}}}' \
            "$(printf '%s:%s' "$ALIYUN_DOCKER_USERNAME" "$ALIYUN_DOCKER_PASSWORD" | base64 | tr -d '\n')" \
            > /kaniko/.docker/config.json

      - name: 构建（无特权，产物出 /tmp/tutorial.tar）
        run: |
          /kaniko/executor --force \
            --dockerfile=Dockerfile --context=. \
            --no-push --tar-path=/tmp/tutorial.tar

      - name: 清理（对称删认证与产物）
        if: always()
        run: |
          rm -f /kaniko/.docker/config.json /tmp/tutorial.tar
