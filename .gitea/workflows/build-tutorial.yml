name: Build Tutorial

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  YARN_NPM_REGISTRY_SERVER: https://registry.npmmirror.com
  API: https://gitea.idealjs.com/api/v1/repos/idealjs/stack

jobs:
  build:
    name: Build @stack/tutorial (kaniko)
    runs-on: ci
    steps:
      - name: 拉源码（actions/checkout）
        uses: actions/checkout@v4

      - name: 写阿里云认证（公网 + VPC 双端点）
        env:
          ALIYUN_DOCKER_USERNAME: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          ALIYUN_DOCKER_PASSWORD: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}
        run: |
          mkdir -p /kaniko/.docker
          AUTH=$(printf '%s:%s' "$ALIYUN_DOCKER_USERNAME" "$ALIYUN_DOCKER_PASSWORD" | base64 | tr -d '\n')
          printf '{"auths":{"registry.cn-hangzhou.aliyuncs.com":{"auth":"%s"},"registry-vpc.cn-hangzhou.aliyuncs.com":{"auth":"%s"}}}' \
            "$AUTH" "$AUTH" > /kaniko/.docker/config.json

      - name: 构建并推阿里云（公网 + VPC 双端点）
        env:
          DOCKER_CONFIG: /kaniko/.docker
        run: |
          /kaniko/executor --force \
            --dockerfile=Dockerfile --context=. \
            --destination=registry.cn-hangzhou.aliyuncs.com/idealjs/stack:${{ github.sha }} \
            --destination=registry-vpc.cn-hangzhou.aliyuncs.com/idealjs/stack:${{ github.sha }} \
            --destination=registry.cn-hangzhou.aliyuncs.com/idealjs/stack:latest \
            --destination=registry-vpc.cn-hangzhou.aliyuncs.com/idealjs/stack:latest

      - name: 清理（对称删认证与产物）
        if: always()
        run: |
          rm -f /kaniko/.docker/config.json
