name: Test Kaniko Pull

on:
  workflow_dispatch:

jobs:
  pull:
    name: kaniko pull 私有镜像验证
    runs-on: ci
    steps:
      - name: 凭据诊断（只输出长度与哈希前缀，不泄露内容）
        env:
          ALIYUN_DOCKER_USERNAME: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          ALIYUN_DOCKER_PASSWORD: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}
        run: |
          node -e '
          const u = process.env.ALIYUN_DOCKER_USERNAME || "";
          const p = process.env.ALIYUN_DOCKER_PASSWORD || "";
          const h = s => require("crypto").createHash("sha256").update(s).digest("hex").slice(0, 12);
          console.log("username len:", u.length, "sha256:", h(u));
          console.log("password len:", p.length, "sha256:", h(p));
          console.log("user 含换行:", /[\r\n]/.test(u), " pass 含换行:", /[\r\n]/.test(p));
          console.log("user 有首尾空白:", u !== u.trim(), " pass 有首尾空白:", p !== p.trim());
          '

      - name: token 服务直测（node 与 kaniko 同一认证入口，分别验 node/oonlyu 两个仓）
        env:
          ALIYUN_DOCKER_USERNAME: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          ALIYUN_DOCKER_PASSWORD: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}
        run: |
          node -e '
          const auth = Buffer.from(process.env.ALIYUN_DOCKER_USERNAME + ":" + process.env.ALIYUN_DOCKER_PASSWORD).toString("base64");
          (async () => {
            for (const repo of ["idealjs/node", "idealjs/oonlyu"]) {
              const url = "https://dockerauth.cn-hangzhou.aliyuncs.com/auth?service=registry.aliyuncs.com:cn-hangzhou:26842&scope=repository:" + repo + ":pull";
              try {
                const r = await fetch(url, { headers: { Authorization: "Basic " + auth } });
                const t = await r.text();
                console.log(repo, "换 token HTTP", r.status, "拿到 token:", t.includes("\"token\""));
              } catch (e) { console.log(repo, "请求异常:", e.message); }
            }
          })();
          '

      - name: 环境诊断（代理变量 + kaniko 版本）
        run: |
          echo "proxy 相关环境变量："
          node -e 'Object.entries(process.env).filter(([k])=>/proxy/i.test(k)).forEach(([k,v])=>console.log(k+"="+v))'
          echo "（上面无输出 = 没有配置代理）"
          /kaniko/executor --version

      - name: 端到端直测（node 换 token 并真实访问 oonlyu）
        env:
          ALIYUN_DOCKER_USERNAME: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          ALIYUN_DOCKER_PASSWORD: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}
        run: |
          node -e '
          const auth = Buffer.from(process.env.ALIYUN_DOCKER_USERNAME + ":" + process.env.ALIYUN_DOCKER_PASSWORD).toString("base64");
          (async () => {
            const r = await fetch("https://dockerauth.cn-hangzhou.aliyuncs.com/auth?service=registry.aliyuncs.com:cn-hangzhou:26842&scope=repository:idealjs/oonlyu:pull,push", { headers: { Authorization: "Basic " + auth } });
            const body = await r.json();
            const token = body.token || body.access_token || "";
            console.log("换 token HTTP", r.status, "token 长度:", token.length);
            const t2 = await fetch("https://registry.cn-hangzhou.aliyuncs.com/v2/idealjs/oonlyu/tags/list", { headers: { Authorization: "Bearer " + token } });
            console.log("用该 token 访问 tags/list HTTP", t2.status, t2.status === 200 ? "（token 真实有效）" : "（token 无权限）");
          })();
          '

      - name: 写阿里云认证（与 build-tutorial 完全同款）
        env:
          ALIYUN_DOCKER_USERNAME: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          ALIYUN_DOCKER_PASSWORD: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}
        run: |
          mkdir -p /kaniko/.docker
          AUTH=$(printf '%s:%s' "$ALIYUN_DOCKER_USERNAME" "$ALIYUN_DOCKER_PASSWORD" | base64 | tr -d '\n')
          printf '{"auths":{"registry.cn-hangzhou.aliyuncs.com":{"auth":"%s"}}}' "$AUTH" > /kaniko/.docker/config.json

      - name: kaniko 拉取 idealjs/oonlyu:20260627145712（只拉不推）
        env:
          DOCKER_CONFIG: /kaniko/.docker
        run: |
          printf 'FROM registry.cn-hangzhou.aliyuncs.com/idealjs/oonlyu:20260627145712\n' > /tmp/Dockerfile
          /kaniko/executor --force \
            --dockerfile=/tmp/Dockerfile --context=/tmp \
            --no-push

      - name: 清理
        if: always()
        run: rm -f /kaniko/.docker/config.json /tmp/Dockerfile
