<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>playground 运行时（沙箱文档）</title>
  </head>
  <body>
    <script type="module">
      // ===== Playground 运行时：宿主 ↔ 运行时唯一通道是 postMessage =====
      // 协议 v1：与宿主侧 src/playground/protocol.ts 手工镜像。本文件零 import 是
      // 「一份原文两条路」的代价；若协议变复杂，改为打包时共享同一份协议源码即可
      // （届时跨源路走构建产物，srcdoc 路注入打包后的内联脚本）。

      const PROTOCOL_VERSION = 1
      const CONSOLE_LEVELS = ['log', 'info', 'warn', 'error']

      /** 运行时 → 宿主。targetOrigin 只能填 '*'：本文档被 sandbox 剥成 opaque origin，
       * 任何具体 origin 都匹配不上它（"null" 不是合法匹配值）；接收方身份由「谁把本文档
       * 装进 iframe」决定，宿主侧则用 event.source === iframe.contentWindow 反向校验。 */
      function post(message) {
        window.parent.postMessage({ v: PROTOCOL_VERSION, ...message }, '*')
      }

      /** 任意值 → 单行文本（输出面板按级别显示；对象走 JSON，失败兜底 String） */
      function format(value) {
        if (typeof value === 'string') return value
        if (value instanceof Error) return value.name + ': ' + value.message
        if (typeof value === 'function') return '[Function ' + (value.name || '(anonymous)') + ']'
        try {
          const json = JSON.stringify(value)
          return json === undefined ? String(value) : json
        } catch {
          return String(value) // 循环引用等 JSON 失败场景
        }
      }

      // ===== console 捕获：包一层，先放行原生输出（DevTools 里仍可看），再回传宿主 =====
      for (const level of CONSOLE_LEVELS) {
        const native = console[level].bind(console)
        console[level] = (...args) => {
          native(...args)
          post({ type: 'console', level, text: args.map(format).join(' ') })
        }
      }

      // ===== 未捕获异常与未处理的 Promise rejection =====
      window.addEventListener('error', (event) => {
        post({ type: 'error', text: event.message || '未知错误' })
      })
      window.addEventListener('unhandledrejection', (event) => {
        post({ type: 'error', text: 'Unhandled rejection: ' + format(event.reason) })
      })

      // ===== 执行入口：构建产物 → Blob URL → import()（以 ESM 执行）=====
      // 收到的 code 已是宿主组件侧 esbuild-wasm 的工程构建产物——TS 转译、多文件解析、
      // esbuild.config.json 的读取校验都在组件那一侧完成，本文件保持零依赖纯执行器。
      // html 是入口文档的身体（宿主已剥掉 <script>，脚本只许走构建通道）：每轮执行先
      // 重置 body——有则注入、无则清空，每次运行都是全新文档；console 包装与异常监听
      // 都挂在 window 上，body 置换不伤及（本内联脚本元素被移除也无碍，求值早已完成）。
      // Blob URL 是 opaque origin 文档里唯一可用的模块通道；两行执行核心（import＋
      // 可选 init）在此后阶段保持不变。
      let runSeq = 0 // 递增执行序号：慢模块的迟回包（异步 console/error）不计入新一轮
      async function execute(code, html) {
        const seq = ++runSeq
        document.body.innerHTML = typeof html === 'string' ? html : ''
        const blobUrl = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }))
        try {
          // @vite-ignore：blob URL 不是静态可分析的说明符——vite dev 的 import-analysis
          // 会因此拒绝 serve 本脚本（build 不受影响），显式标注跳过分析
          const mod = await import(/* @vite-ignore */ blobUrl)
          // 最小生命周期约定：默认导出可选 { init() }——import 完成后调用。
          // 这是将来 init()/update() 练习框架的接缝：本阶段只认 init，不做更多。
          if (typeof mod.default?.init === 'function') await mod.default.init()
          if (seq === runSeq) post({ type: 'done' })
        } catch (err) {
          if (seq === runSeq) post({ type: 'error', text: format(err) })
        } finally {
          // 模块执行已进入 ESM 缓存，URL 即刻失效无碍；每次 Run 都生成新 URL → 天然绕开
          // 模块缓存、同一份代码可重复执行
          URL.revokeObjectURL(blobUrl)
        }
      }

      // ===== 宿主 → 运行时：只认「父窗口 + 结构合法」的消息，其余静默丢弃 =====
      // - ping：宿主索要一次 ready 报到（启动竞态的确定性兜底，见协议文件）
      // - run：结构合法才执行
      window.addEventListener('message', (event) => {
        if (event.source !== window.parent) return
        const msg = event.data
        if (!msg || msg.v !== PROTOCOL_VERSION) return
        if (msg.type === 'ping') return postReady()
        if (msg.type === 'run' && typeof msg.code === 'string') {
          execute(msg.code, typeof msg.html === 'string' ? msg.html : undefined)
        }
      })

      // ===== ready：向宿主报到，并带上一份「隔离生效」的自证 =====
      // - origin：location.origin 的序列化——srcdoc 路是 "null"；跨源 src 路是部署位 URL。
      //   它只是部署位标识：allow-scripts 沙箱下文档 origin 对存储仍按 opaque 处理，OPFS
      //   照样被拒（见上）；宿主用它做同源击穿报警（等于宿主源即亮红）。
      // - parentBlocked：读 parent.location.href 必抛 SecurityError——「沙箱拿不到宿主任何
      //   数据」的直接证据，e2e 据此断言（e2e/playground.spec.ts）。
      // 加载完成先自发报到一次；宿主监听器若尚未挂上会漏收，ping 补发兜底。
      let parentBlocked = false
      try {
        void window.parent.location.href
        parentBlocked = false
      } catch {
        parentBlocked = true // 预期路径：opaque origin 对父窗口的同源访问全部抛错
      }
      function postReady() {
        post({ type: 'ready', origin: String(window.location.origin), parentBlocked })
      }
      postReady()
    </script>
  </body>
</html>
