<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML · 技能熟悉 · idealjs stack</title>
    <style>@view-transition { navigation: auto; }</style>
    <script>
      var vt = sessionStorage.getItem("vt")
      if (vt) document.documentElement.dataset.vt = vt
      sessionStorage.removeItem("vt")
      document.addEventListener("click", function (e) {
        var a = e.target.closest("a[data-dir]")
        if (a) sessionStorage.setItem("vt", a.dataset.dir)
      })
    </script>
    <meta name="description" content="技能熟悉 · HTML：用标记描述网页结构。专项教程逐步补充中。" />
    <link rel="stylesheet" href="../src/styles/tailwind.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../src/pages/html/main.tsx"></script>
  </body>
</html>
