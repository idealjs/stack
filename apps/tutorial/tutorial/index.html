<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>全栈教程 · 做一个自己的待办清单 · idealjs stack</title>
    <style>@view-transition { navigation: auto; }</style>
    <script>
      var vt = sessionStorage.getItem("vt")
      if (vt) document.documentElement.dataset.vt = vt
      sessionStorage.removeItem("vt")
      document.addEventListener("click", function (e) {
        var a = e.target.closest("a[data-dir]")
        if (a) sessionStorage.setItem("vt", a.dataset.dir)
      })
    </script>
    <meta name="description" content="从页面、交互到 API 和数据库，逐步完成一个单人版 TodoList。了解技术积木、浏览器内运行时与 Agent 练习环境、预计学习时间，以及贯穿全栈的数据控制。" />
    <link rel="stylesheet" href="../src/styles/tailwind.css" />
    <link rel="stylesheet" href="../src/pages/learn/learn.css" />
    <link rel="stylesheet" href="../src/pages/learn/learn-todo.css" />
    <link rel="stylesheet" href="../src/pages/learn/learn-tour.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../src/pages/learn/main.tsx"></script>
  </body>
</html>
